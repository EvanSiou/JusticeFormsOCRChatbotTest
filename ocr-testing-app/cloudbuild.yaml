steps:
  # Build backend image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-f",
        "./backend/Dockerfile",
        "-t",
        "gcr.io/$PROJECT_ID/ocr-app-backend",
        "./backend",
      ]

  # Build frontend image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/ocr-app-frontend",
        "./frontend",
      ]

  # Push backend image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/ocr-app-backend"]

  # Push frontend image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/ocr-app-frontend"]

  # Deploy backend to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "ocr-app-backend"
      - "--image"
      - "gcr.io/$PROJECT_ID/ocr-app-backend"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--memory"
      - "16Gi"
      - "--cpu"
      - "4"
      - "--timeout"
      - "3600"
      - "--max-instances"
      - "2"
      - "--concurrency"
      - "80"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "GCP_PROJECT_ID=$PROJECT_ID,GCP_STORAGE_BUCKET=${_STORAGE_BUCKET},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY}"

  # Deploy frontend to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "ocr-app-frontend"
      - "--image"
      - "gcr.io/$PROJECT_ID/ocr-app-frontend"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--memory"
      - "256Mi"
      - "--allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/ocr-app-backend"
  - "gcr.io/$PROJECT_ID/ocr-app-frontend"

substitutions:
  _STORAGE_BUCKET: "ecourtdateocr-ocr-forms"
  _ANTHROPIC_API_KEY: ""

options:
  machineType: "E2_HIGHCPU_8"
  diskSizeGb: 100
timeout: "3600s"
